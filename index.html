<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightsky Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0f1a;
    --bg2: #131729;
    --bg3: #1a1f35;
    --accent: #7c9cff;
    --accent2: #a78bfa;
    --text: #e8eaf6;
    --text2: #9ba3c7;
    --text3: #5a6490;
    --border: rgba(124, 156, 255, 0.12);
    --border2: rgba(124, 156, 255, 0.25);
    --card-bg: rgba(26, 31, 53, 0.8);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 별 효과 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 156, 255, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 80% 20%, rgba(167, 139, 250, 0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to { opacity: var(--max-op); transform: scale(1); }
  }

  /* 레이아웃 */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  /* 헤더 */
  header {
    padding: 2rem 0 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
  }

  .logo-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  nav a {
    color: var(--text2);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--accent); }

  /* 히어로 */
  .hero {
    padding: 6rem 0 5rem;
    text-align: center;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    padding: 5px 14px;
    border: 1px solid var(--border2);
    border-radius: 100px;
    background: rgba(124, 156, 255, 0.05);
  }

  .hero-eyebrow::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
    background: linear-gradient(135deg, #e8eaf6 0%, #a0aec8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero h1 em {
    font-style: italic;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-desc {
    font-size: 1rem;
    color: var(--text2);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto 3rem;
    font-weight: 300;
  }

  /* 앱 카드 섹션 */
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
    margin-bottom: 5rem;
  }

  .app-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: border-color 0.3s, transform 0.3s, background 0.3s;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .app-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top left, rgba(124, 156, 255, 0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .app-card:hover {
    border-color: var(--border2);
    transform: translateY(-3px);
    background: rgba(30, 36, 60, 0.9);
  }

  .app-card:hover::before { opacity: 1; }

  .app-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(124, 156, 255, 0.2), rgba(167, 139, 250, 0.2));
    border: 1px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .app-badge {
    display: inline-flex;
    align-items: center;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 100px;
    background: rgba(124, 156, 255, 0.1);
    color: var(--accent);
    border: 1px solid rgba(124, 156, 255, 0.2);
    width: fit-content;
  }

  .app-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.2;
  }

  .app-desc {
    font-size: 0.85rem;
    color: var(--text2);
    line-height: 1.7;
    flex: 1;
  }

  .app-link {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
    transition: gap 0.2s;
  }

  .app-card:hover .app-link { gap: 10px; }

  .app-link svg {
    width: 14px;
    height: 14px;
    transition: transform 0.2s;
  }

  .app-card:hover .app-link svg { transform: translateX(2px); }

  /* 플랫폼 태그 */
  .platform-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .platform-tag {
    font-size: 0.7rem;
    color: var(--text3);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 100px;
    letter-spacing: 0.05em;
  }

  /* 푸터 */
  footer {
    border-top: 1px solid var(--border);
    padding: 2.5rem 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: gap;
    gap: 1rem;
  }

  .footer-copy {
    font-size: 0.78rem;
    color: var(--text3);
  }

  .footer-links {
    display: flex;
    gap: 1.5rem;
  }

  .footer-links a {
    font-size: 0.78rem;
    color: var(--text3);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-links a:hover { color: var(--text2); }

  /* 페이드인 애니메이션 */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.7s ease forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-up:nth-child(1) { animation-delay: 0.1s; }
  .fade-up:nth-child(2) { animation-delay: 0.2s; }
  .fade-up:nth-child(3) { animation-delay: 0.3s; }
  .fade-up:nth-child(4) { animation-delay: 0.4s; }

  @media (max-width: 600px) {
    .hero { padding: 4rem 0 3rem; }
    footer { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <header>
    <a href="/" class="logo">
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="rgba(124,156,255,0.3)" stroke-width="1"/>
        <circle cx="16" cy="16" r="6" fill="none" stroke="rgba(124,156,255,0.6)" stroke-width="1"/>
        <circle cx="16" cy="7" r="1.5" fill="#7c9cff"/>
        <circle cx="23.5" cy="21" r="1" fill="#a78bfa" opacity="0.8"/>
        <circle cx="8.5" cy="21" r="1" fill="#a78bfa" opacity="0.8"/>
        <circle cx="10" cy="10" r="0.8" fill="#7c9cff" opacity="0.6"/>
        <circle cx="22" cy="10" r="0.8" fill="#7c9cff" opacity="0.6"/>
        <circle cx="16" cy="16" r="2" fill="#7c9cff"/>
      </svg>
      <span class="logo-text">Nightsky Works</span>
    </a>
    <nav>
      <a href="mailto:contact@nightskyworks.app">문의</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-eyebrow fade-up">Windows 앱 개발</div>
    <h1 class="fade-up">Windows용<br><em>심플한 앱들</em></h1>
    <p class="hero-desc fade-up">
      광고 없이. 복잡함 없이.
    </p>
  </section>

  <div class="section-label fade-up">앱</div>

  <div class="apps-grid">
    <a href="/plaincalendar/" class="app-card fade-up">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div class="app-icon">📅</div>
        <span class="app-badge">출시됨</span>
      </div>
      <div>
        <div class="app-name">Plain Calendar</div>
      </div>
      <p class="app-desc">
        Google 캘린더 & Tasks와 동기화되는 Windows 네이티브 캘린더 앱. 광고 없이, 깔끔하게.
      </p>
      <div class="platform-tags">
        <span class="platform-tag">Windows 11</span>
        <span class="platform-tag">Microsoft Store</span>
      </div>
      <div class="app-link">
        자세히 보기
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1 7h12M8 2l5 5-5 5"/>
        </svg>
      </div>
    </a>
  </div>

  <footer>
    <span class="footer-copy">© 2026 Nightsky Works. All rights reserved.</span>
    <div class="footer-links">
      <a href="/plaincalendar/privacy-policy.html">개인정보처리방침</a>
      <a href="/plaincalendar/terms-of-service.html">서비스 약관</a>
    </div>
  </footer>
</div>

<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 1.8 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --d:${2 + Math.random()*4}s;
      --max-op:${0.2 + Math.random()*0.6};
      animation-delay:${Math.random()*5}s;
    `;
    stars.appendChild(s);
  }
</script>
</body>
</html>
